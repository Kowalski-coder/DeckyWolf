name: Release DeckyWolf

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl file libfuse2 zsync patch zip unzip gcc libevdev-dev libwayland-dev libx11-dev

      - name: Download official LibreWolf AppImage base
        run: |
          echo "Downloading LibreWolf 159.0-1 AppImage..."
          curl -L --fail --retry 3 -o /tmp/librewolf.AppImage "https://dl.librewolf.net/librewolf/159.0-1/librewolf-159.0-1-linux-x86_64-appimage.AppImage"
          chmod +x /tmp/librewolf.AppImage

      - name: Install appimagetool
        run: |
          wget -q -O /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          cd /tmp && /tmp/appimagetool --appimage-extract >/dev/null
          sudo mv /tmp/squashfs-root /opt/appimagetool
          sudo ln -sf /opt/appimagetool/AppRun /usr/local/bin/appimagetool

      - name: Build DeckyWolf AppImage
        run: |
          chmod +x build.sh
          OUT_APPIMAGE="$PWD/deckywolf.appimage" ./build.sh /tmp/librewolf.AppImage

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "DeckyWolf ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            deckywolf.appimage
          generate_release_notes: false
