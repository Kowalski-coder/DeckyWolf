<?xml version="1.0"?> <!-- -*- Mode: HTML -*- -->


<?xml-stylesheet href="chrome://global/skin/global.css" type="text/css"?>
<?xml-stylesheet href="chrome://browser/content/aboutDialog.css" type="text/css"?>

<window xmlns:html="http://www.w3.org/1999/xhtml"
        xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
        id="aboutDialog"
        windowtype="Browser:About"
        data-l10n-id="aboutDialog-title"
        role="dialog"
        aria-describedby="version distribution distributionId communityDesc contributeDesc trademark"
        >
  <script src="chrome://browser/content/utilityOverlay.js"/>

  <linkset>
    <html:link rel="localization" href="branding/brand.ftl"/>
    <html:link rel="localization" href="browser/aboutDialog.ftl"/>
  </linkset>

  <script src="chrome://browser/content/aboutDialog.js"/>

  <div id="grid">
    <div id="left" />
    <div id="right">
      <label id="wordmark">DeckyWolf</label>
      <div id="version">
        <label id="versionNumber" />
      </div>
      <label id="distribution" />
      <label id="distributionId" />
      <label id="aboutText" data-l10n-id="about-librewolf" />
      <label id="websiteLink" is="text-link" href="https://deckyloader.ru/">deckyloader.ru</label>
    </div>
  </div>

  <keyset>
    <key keycode="VK_ESCAPE" id="escapeKey"/>
  </keyset>

</window>
